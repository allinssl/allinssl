name: 自动编译

on:
  push:

  release:
    types:
      - published

  workflow_dispatch:

env:
  TZ: Asia/Shanghai

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    # 环境准备
    - name: 安装最新版 Golang
      uses: actions/setup-go@v4
      with:
        go-version: 'stable'

    - name: 检测Golang环境版本
      run: |
        go version

    - name: 安装 Node
      uses: actions/setup-node@v4
      with:
        node-version: 'lts/*'

    - name: 检测 Node 版本
      run: |
        node -v

    - name: 检测 npm 版本
      run: |
        npm -v

    - name: 下载 upx
      run: |
        wget -qO- https://github.com/upx/upx/releases/download/v5.2.0/upx-5.2.0-amd64_linux.tar.xz | tar -xJ

    - name: 安装 upx
      run: |
        sudo rm /usr/bin/upx
        sudo cp upx-5.2.0-amd64_linux/upx /usr/bin/
        rm -rf upx-5.2.0-amd64_linux

    - name: 验证 upx 
      run: |
        which upx
        upx --version


    # 编译

    - name: 压缩静态资源
      run: |
        npm install terser html-minifier-terser postcss cssnano sharp svgo glob fast-glob
        node min.js


#############################
##### Linux AMD64 Build #####
#############################

    - name: Linux AMD64-V3 Build
      env:
        GOAMD64: v3
        GOARCH: amd64
        GOOS: linux
      run: |
        go mod tidy
        go build -gcflags="-l=4" -pgo=auto -trimpath -ldflags="-s -w" -o allinssl cmd/main.go
    
    - name: 压缩
      run: |
        upx --best allinssl
    
    - name: 移动
      run: |
        mkdir -p ./build/linux/amd64/GOAMD64-v3
        mv allinssl ./build/linux/amd64/GOAMD64-v3




    - name: Linux AMD64-V2 Build
      env:
        GOAMD64: v2
        GOARCH: amd64
        GOOS: linux
      run: |
        go mod tidy
        go build -gcflags="-l=4" -pgo=auto -trimpath -ldflags="-s -w" -o allinssl cmd/main.go
    
    - name: 压缩
      run: |
        upx --best allinssl
    
    - name: 移动
      run: |
        mkdir -p ./build/linux/amd64/GOAMD64-v2
        mv allinssl ./build/linux/amd64/GOAMD64-v2




    - name: Linux AMD64-V1 Build
      env:
        GOAMD64: v1
        GOARCH: amd64
        GOOS: linux
      run: |
        go mod tidy
        go build -gcflags="-l=4" -pgo=auto -trimpath -ldflags="-s -w" -o allinssl cmd/main.go
    
    - name: 压缩
      run: |
        upx --best allinssl
    
    - name: 移动
      run: |
        mkdir -p ./build/linux/amd64/GOAMD64-v1
        mv allinssl ./build/linux/amd64/GOAMD64-v1

    # 部署

    - name: 部署
      run: |
        cd ./build
        git init
        git config user.name "${{ github.actor }}"
        git config user.email "${{ github.actor }}@users.noreply.github.com"
        git add .
        git commit -m "${{ github.event.head_commit.message }}··[$(date +"%Z %Y-%m-%d %A %H:%M:%S")]"
        git push --force --quiet "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" master:refs/heads/build